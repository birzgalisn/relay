services:
  media-init:
    image: busybox:latest
    user: root
    volumes:
      - media_data:/relay-media
    command: chown -R 1000:1000 /relay-media
    deploy:
      restart_policy:
        condition: none
        max_attempts: 1

  api:
    image: ${IMAGE_ROOT}-api:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      API_BASE_URL: ${API_BASE_URL}
    volumes:
      - media_data:/relay-media
    networks:
      - relay_edge
      - relay_internal
    depends_on:
      - media-init
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
      labels:
        - traefik.enable=true
        - traefik.http.routers.${PROJECT}-api.rule=Host(`api.${CNAME}`)
        - traefik.http.routers.${PROJECT}-api.entrypoints=https
        - traefik.http.routers.${PROJECT}-api.tls=true
        - traefik.http.routers.${PROJECT}-api.tls.certresolver=letsencrypt
        - traefik.http.routers.${PROJECT}-api.service=${PROJECT}-api
        - traefik.http.services.${PROJECT}-api.loadbalancer.server.port=3000
        - traefik.http.services.${PROJECT}-api.loadbalancer.healthcheck.path=/up
        - traefik.http.services.${PROJECT}-api.loadbalancer.healthcheck.interval=5s
        - traefik.http.services.${PROJECT}-api.loadbalancer.healthcheck.timeout=2s
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:3000/up]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  relay_edge:
    external: true
  relay_internal:
    external: true

volumes:
  media_data:
