fragment Post on Post {
  __typename
  id
  caption
  createdAt
  files {
    __typename
    id
    url
    uploadStatus
    sortOrder
  }
}

query Posts($pageSize: Int = 10, $cursor: String) {
  posts(pageSize: $pageSize, cursor: $cursor) {
    __typename
    nodes {
      ...Post
    }
    nextCursor
    hasNextPage
  }
}

query Post($id: ID!) {
  post(id: $id) {
    ...Post
  }
}

mutation CreatePost($input: CreatePostInput!) {
  createPost(input: $input) {
    id
  }
}

mutation DeletePost($id: ID!) {
  deletePost(id: $id)
}

fragment PostCreatedEvent on PostCreated {
  __typename
  id
  caption
  createdAt
  files {
    __typename
    id
    url
    uploadStatus
    sortOrder
  }
}

fragment PostRemovedEvent on PostRemoved {
  __typename
  id
}

subscription PostsFeed($pageSize: Int = 10) {
  postsFeed(pageSize: $pageSize, cursor: null) {
    __typename
    ...PostCreatedEvent
    ...PostRemovedEvent
  }
}
